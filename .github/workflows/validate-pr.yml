name: Verify BMAD pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: astral-sh/setup-uv@v6
      - name: Unit tests
        run: node --test scripts/*.test.mjs
      - name: Validate marketplace distribution
        run: npm run check
      - name: Verify existing workflow runtime
        run: npm run integration
      - name: Verify WDS workflow runtime
        run: npm run integration:wds
      - name: Verify full sync and adapter against current upstream BMAD
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 https://github.com/bmad-code-org/BMAD-METHOD.git .tmp/bmad
          npm run sync
          node scripts/validate-manifest.mjs
          npm run build -- .tmp/bmad
          npm run check
          npm run integration
