name: Sync BMAD

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

concurrency:
  group: sync-bmad
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync upstream BMAD
        run: npm run sync

      - name: Validate manifest
        run: npm run check

      - name: Commit upstream changes
        shell: bash
        run: |
          if git diff --quiet -- upstream/; then
            echo "BMAD is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream/
          git commit -m "chore: sync upstream BMAD"
          git push
