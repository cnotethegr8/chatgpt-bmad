name: Sync BMAD

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

concurrency:
  group: sync-bmad
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone upstream BMAD
        run: git clone --depth 1 https://github.com/bmad-code-org/BMAD-METHOD.git .tmp/bmad

      - name: Sync upstream metadata
        run: npm run sync

      - name: Build ChatGPT marketplace
        run: npm run build -- .tmp/bmad

      - name: Validate generated distribution
        run: npm run check

      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet -- upstream/ plugin/ .claude-plugin/; then
            echo "BMAD distribution is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream/ plugin/ .claude-plugin/
          git commit -m "chore: sync upstream BMAD distribution"
          git push
