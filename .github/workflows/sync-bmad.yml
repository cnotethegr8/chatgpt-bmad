name: Sync BMAD

on:
  workflow_dispatch:
    inputs:
      simulate_failure_stage:
        description: 'Manual acceptance test only: inject a compatibility failure'
        required: false
        default: none
        type: choice
        options:
          - none
          - upstream_sync
          - adapter_generator
          - validate_manifest
          - validate_plugin
          - runtime_bootstrap
          - bmad_workflow_runtime
          - runtime_integration
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'package.json'
      - '.github/workflows/sync-bmad.yml'
      - '.gitignore'

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-bmad
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SIMULATE_FAILURE_STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure_stage || 'none' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: astral-sh/setup-uv@v6

      - name: Prepare compatibility diagnostics
        shell: bash
        run: |
          mkdir -p .tmp/compat
          node - <<'NODE'
          const fs = require('fs');
          let version = null;
          let sha = null;
          try { version = JSON.parse(fs.readFileSync('plugins/bmad-method/UPSTREAM.json', 'utf8')).version ?? null; } catch {}
          try { sha = fs.readFileSync('upstream/VERSION', 'utf8').trim() || null; } catch {}
          fs.writeFileSync('.tmp/compat/previous-good.json', JSON.stringify({ version, sha }));
          NODE

      - name: Clone upstream BMAD
        id: upstream_clone
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          git clone --depth 1 https://github.com/bmad-code-org/BMAD-METHOD.git .tmp/bmad 2>&1 | tee .tmp/compat/upstream_clone.log

      - name: Capture upstream identity
        if: steps.upstream_clone.outcome == 'success'
        shell: bash
        run: |
          git -C .tmp/bmad rev-parse HEAD > .tmp/compat/upstream-sha
          node -e "const p=require('./.tmp/bmad/package.json'); process.stdout.write(String(p.version || ''))" > .tmp/compat/upstream-version

      - name: Sync upstream metadata
        id: upstream_sync
        if: steps.upstream_clone.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > .tmp/compat/upstream_sync.log
          node scripts/simulate-compatibility-failure.mjs --stage upstream_sync --log .tmp/compat/upstream_sync.log
          npm run sync 2>&1 | tee -a .tmp/compat/upstream_sync.log

      - name: Build ChatGPT marketplace
        id: adapter_generator
        if: steps.upstream_sync.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > .tmp/compat/adapter_generator.log
          node scripts/simulate-compatibility-failure.mjs --stage adapter_generator --log .tmp/compat/adapter_generator.log
          npm run build -- .tmp/bmad 2>&1 | tee -a .tmp/compat/adapter_generator.log

      - name: Validate marketplace manifest
        id: validate_manifest
        if: steps.adapter_generator.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > .tmp/compat/validate_manifest.log
          node scripts/simulate-compatibility-failure.mjs --stage validate_manifest --log .tmp/compat/validate_manifest.log
          node scripts/validate-manifest.mjs 2>&1 | tee -a .tmp/compat/validate_manifest.log

      - name: Validate generated distribution
        id: validate_plugin
        if: steps.validate_manifest.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > .tmp/compat/validate_plugin.log
          node scripts/simulate-compatibility-failure.mjs --stage validate_plugin --log .tmp/compat/validate_plugin.log
          node scripts/validate-plugin.mjs 2>&1 | tee -a .tmp/compat/validate_plugin.log

      - name: Runtime integration smoke
        id: integration
        if: steps.validate_plugin.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > .tmp/compat/integration.log
          node scripts/simulate-compatibility-failure.mjs --stage integration --log .tmp/compat/integration.log
          npm run integration 2>&1 | tee -a .tmp/compat/integration.log

      - name: Report compatibility failure
        if: >-
          always() && (
            steps.upstream_clone.outcome == 'failure' ||
            steps.upstream_sync.outcome == 'failure' ||
            steps.adapter_generator.outcome == 'failure' ||
            steps.validate_manifest.outcome == 'failure' ||
            steps.validate_plugin.outcome == 'failure' ||
            steps.integration.outcome == 'failure'
          )
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ steps.upstream_clone.outcome }}" == "failure" ]]; then stage=upstream_clone
          elif [[ "${{ steps.upstream_sync.outcome }}" == "failure" ]]; then stage=upstream_sync
          elif [[ "${{ steps.adapter_generator.outcome }}" == "failure" ]]; then stage=adapter_generator
          elif [[ "${{ steps.validate_manifest.outcome }}" == "failure" ]]; then stage=validate_manifest
          elif [[ "${{ steps.validate_plugin.outcome }}" == "failure" ]]; then stage=validate_plugin
          else stage=integration
          fi
          node scripts/report-compatibility.mjs --stage "$stage" --log ".tmp/compat/$stage.log"

      - name: Fail incompatible sync
        if: >-
          always() && (
            steps.upstream_clone.outcome == 'failure' ||
            steps.upstream_sync.outcome == 'failure' ||
            steps.adapter_generator.outcome == 'failure' ||
            steps.validate_manifest.outcome == 'failure' ||
            steps.validate_plugin.outcome == 'failure' ||
            steps.integration.outcome == 'failure'
          )
        run: exit 1

      - name: Resolve compatibility incidents
        if: steps.integration.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/resolve-compatibility.mjs

      - name: Commit generated changes
        if: steps.integration.outcome == 'success' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "BMAD distribution is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync upstream BMAD distribution"
          git push
